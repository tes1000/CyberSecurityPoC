<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Firesand Reflected XSS Demo</title>
  <!-- Google Fonts for gaming aesthetic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Exo:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Updated color scheme with eb1c23 (bright red) */
      --bg-primary: #0f1923;
      --bg-secondary: #1a2633;
      --bg-tertiary: #232e3c;
      --accent-primary: #eb1c23; /* Changed from #00ffb3 to eb1c23 */
      --accent-secondary: #ff5e00; /* Changed to complement the new red */
      --text-primary: #ffffff;
      --text-secondary: #a3a9b2;
      --safe: #00cc66;
      --unsafe: #eb1c23; /* Match accent-primary for consistency */
      --border: #2a3544;
      --shadow-sm: 0 4px 8px rgba(0, 0, 0, 0.2), 0 0 4px rgba(235, 28, 35, 0.1);
      --shadow-md: 0 6px 12px rgba(0, 0, 0, 0.25), 0 0 8px rgba(235, 28, 35, 0.15);
      --shadow-lg: 0 8px 16px rgba(0, 0, 0, 0.3), 0 0 12px rgba(235, 28, 35, 0.2);
      --glow-sm: 0 0 8px rgba(235, 28, 35, 0.2);
      --glow-md: 0 0 15px rgba(235, 28, 35, 0.3);
      --glow-lg: 0 0 20px rgba(235, 28, 35, 0.4);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      --bg-primary: #121c29; /* your fallback background */
      font-family: 'Exo', sans-serif;
      background: repeating-linear-gradient(135deg, var(--bg-primary) 0%, #131d2c 40%);
      background-color: var(--bg-primary);
      background-size: 5% 5%; 
      background-image: url('gamblingCopy.png'); /* Changed from Base64 to file */
      background-size: 400px; /* Optional: tweak size depending on visual density */
      background-position: top left;
    }
    
    .container {
      padding: 20px;
    }
    
    .logo {
      width: 250px;
      height: 250px;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: url('logo.png'); 
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }
    
    h1 {
      font-family: 'Russo One', sans-serif;
      margin-bottom: 30px;
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      display: inline-block;
      color: var(--text-primary);
      text-shadow: 0 0 10px rgba(235, 28, 35, 0.5); /* Updated to match eb1c23 */
    }
    
    h1::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
    }
    
    p {
      color: var(--text-secondary);
      margin-bottom: 25px;
      font-size: 1.05rem;
    }
    
    #output {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 25px;
      margin: 25px 0;
      min-height: 120px;
      text-align: left;
      background-color: var(--bg-secondary);
      box-shadow: var(--shadow-lg);
      animation: glow 4s infinite alternate;
    }
    
    @keyframes glow {
      0% {
        box-shadow: var(--shadow-lg);
      }
      100% {
        box-shadow: var(--shadow-lg), var(--glow-md);
      }
    }
    
    .param-info {
      margin-top: 40px;
      color: var(--text-secondary);
      font-size: 14px;
      padding: 15px;
      background-color: var(--bg-tertiary);
      border-radius: 8px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    code {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 4px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      color: var(--accent-primary);
      word-break: break-all;
    }
    
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 20px;
      font-size: 14px;
      box-shadow: var(--shadow-md);
      border-radius: 8px;
      overflow: hidden;
    }
    
    th, td {
      border: 1px solid var(--border);
      padding: 12px;
      text-align: left;
    }
    
    th {
      background-color: var(--bg-tertiary);
      color: var(--accent-primary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 13px;
    }
    
    .param-row {
      transition: all 0.2s ease;
    }
    
    .param-row:hover {
      background-color: rgba(235, 28, 35, 0.05); /* Updated to match eb1c23 */
    }
    
    .param-row:nth-child(even) {
      background-color: var(--bg-tertiary);
    }
    
    .safe-cell {
      background-color: rgba(0, 204, 102, 0.05);
      border-left: 3px solid var(--safe);
    }
    
    .vulnerable-cell {
      background-color: rgba(255, 51, 102, 0.05);
      border-left: 3px solid var(--unsafe);
    }
    
    .code {
      font-family: monospace;
      word-break: break-word;
      font-size: 13px;
    }
    .view{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      width: 80vw;
      margin: auto;
    }
    h3 {
      margin-bottom: 20px;
      color: var(--accent-primary);
      font-weight: 600;
      font-size: 1.3rem;
    }
    
    /* Gamer-inspired hexagonal button styling */
    .example-button {
      position: relative;
      padding: 8px 15px;
      margin-top: 10px;
      background: transparent;
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
      font-family: 'Exo', sans-serif;
      text-transform: uppercase;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.3s;
      clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0 50%);
      box-shadow: var(--shadow-sm);
    }
    
    .example-button:hover {
      background-color: rgba(235, 28, 35, 0.1); /* Updated to match eb1c23 */
      box-shadow: var(--shadow-sm), var(--glow-sm);
      transform: translateY(-2px);
    }
    
    .example-button:active {
      transform: translateY(0);
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"></div>
    <div class="view">
    <h1>Reflected XSS Demo</h1>
    
    <p>This demo shows how double-encoded parameters in URLs can bypass WAF protections.</p>
    
    <div id="output">
      <p>No parameters detected. Try adding some to the URL.</p>
    </div>
    
    <div class="param-info">
      <p>Example: <code>?msg=%253Cimg%2520src%253Dx%2520onerror%253Dalert(1)%253E</code></p>
      <button class="example-button" onclick="window.location.href='?msg=%253Cimg%2520src%253Dx%2520onerror%253Dalert(1)%253E'">
        Try Example
      </button>
    </div>
  </div>
</div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const queryString = window.location.search.substring(1); // Remove "?"
      const rawParams = queryString.split('&');
      const outputDiv = document.getElementById('output');

      if (queryString && rawParams.length > 0 && rawParams[0]) {
        outputDiv.innerHTML = '';

        const heading = document.createElement('h3');
        heading.textContent = 'Parameter Decoding Analysis:';
        outputDiv.appendChild(heading);

        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        ['Parameter', 'Original Value', 'Decoded Once', 'Decoded Twice'].forEach(text => {
          const th = document.createElement('th');
          const thCode = document.createElement('code');
          thCode.textContent = text;
          thCode.className = 'code';
          th.appendChild(thCode);
          headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');

        rawParams.forEach(param => {
          const [rawKey, rawValue = ''] = param.split('=');
          if (!rawKey) return;

          try {
            const key = decodeURIComponent(rawKey);
            const decodedOnce = decodeURIComponent(rawValue);
            const decodedTwice = decodeURIComponent(decodedOnce);

            const row = document.createElement('tr');
            row.className = 'param-row';

            const keyCell = document.createElement('td');
            const keyCode = document.createElement('code');
            keyCode.className = 'code';
            keyCode.textContent = key;
            keyCell.appendChild(keyCode);
            row.appendChild(keyCell);

            const originalCell = document.createElement('td');
            const originalCode = document.createElement('code');
            originalCode.className = 'code';
            originalCode.textContent = rawValue;
            originalCell.appendChild(originalCode);
            row.appendChild(originalCell);

            const onceCell = document.createElement('td');
            const onceCode = document.createElement('code');
            onceCode.className = 'code';
            onceCode.textContent = decodedOnce;
            onceCell.appendChild(onceCode);
            row.appendChild(onceCell);

            const twiceCell = document.createElement('td');
            const isVulnerable = /<\s*script|on\w+\s*=|<\s*img[^>]*onerror\s*=|javascript:/i.test(decodedTwice);

            twiceCell.className = isVulnerable ? 'vulnerable-cell' : 'safe-cell';
            twiceCell.innerHTML = isVulnerable 
              ? decodedTwice + ' <strong style="color:var(--unsafe);">(Vulnerable)</strong>' 
              : `<code class="code">${decodedTwice}</code> <strong style="color:var(--safe);">(Safe)</strong>`;
            row.appendChild(twiceCell);

            tbody.appendChild(row);
          } catch (e) {
            const row = document.createElement('tr');
            row.className = 'param-row';

            const keyCell = document.createElement('td');
            keyCell.textContent = rawKey;
            row.appendChild(keyCell);

            const errorCell = document.createElement('td');
            errorCell.colSpan = 3;
            errorCell.style.color = 'var(--unsafe)';
            errorCell.textContent = `Error decoding parameter: ${e.message}`;
            row.appendChild(errorCell);

            tbody.appendChild(row);
          }
        });

        table.appendChild(tbody);
        outputDiv.appendChild(table);
      }
    });
  </script>
</body>
</html>
